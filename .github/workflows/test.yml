name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1' # weekly, to catch regressions from new Cecil releases

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: mbstring, intl, gettext, fileinfo, gd
          coverage: none

      - name: Download Cecil
        run: |
          curl -sSOL https://cecil.app/cecil.phar
          php cecil.phar --version

      - name: Link theme into the demo site
        run: php demo/link.php

      - name: Build demo
        run: php cecil.phar build demo -v

      - name: Check generated `_redirects` file
        run: diff <(sort demo/expected/_redirects) <(sort demo/_site/_redirects)

      - name: Check `_redirects` is excluded from listings
        run: |
          if grep -l '_redirects' demo/_site/blog/index.html demo/_site/sitemap.xml demo/_site/atom.xml demo/_site/blog/atom.xml; then
            echo "::error::The _redirects page is listed"
            exit 1
          fi
